    <script>
      /**
       * Browser detection for video format selection
       * NOTE: Keep this logic in sync with src/util/browserDetection.ts
       *
       * Priority order (most specific first):
       * 1. Instagram iOS - Uses WKWebView (Safari engine) → .mov
       * 2. Safari - Desktop/mobile Safari → .mov
       * 3. Default - Chrome/Firefox/Edge → .webm
       */
      function detectVideoExtension() {
        const ua = navigator.userAgent;

        // Instagram iOS in-app browser (must check before Safari)
        if (/Instagram/i.test(ua) && /iPhone|iPad/i.test(ua)) {
          return "mov";
        }

        // Safari desktop/mobile (not Chrome or Android)
        if (/^((?!chrome|android).)*safari/i.test(ua)) {
          return "mov";
        }

        // Default: Chrome, Firefox, Edge (WebM compatible)
        return "webm";
      }

      const ext = detectVideoExtension();
      const sources = [`/first.${ext}`, `/test.${ext}`];

      sources.forEach((src) => {
        const v = document.createElement("video");
        v.src = src;
        v.muted = true;
        v.preload = "auto";
        v.playsInline = true;
        v.fetchPriority = "high";
        v.style.display = "none";

        // force an early decode warmup
        v.play()
          .then(() => v.pause())
          .catch(() => {});

        document.head.appendChild(v);
      });

      // Preload artwork videos after page load (lower priority than hero videos + fish model)
      window.addEventListener("load", () => {
        const artSources = [
          "/art/HankBerger0.mp4",
          "/art/HankBerger1.mp4",
          "/art/HankBerger2.mp4",
          "/art/HankBerger3.mp4",
          "/art/HankBerger4.mp4",
          "/art/HankBerger5.mp4",
          "/art/HankBerger6.mp4",
          "/art/HankBerger7.mp4",
        ];

        let i = 0;
        function preloadNext() {
          if (i >= artSources.length) return;
          const v = document.createElement("video");
          v.src = artSources[i++];
          v.muted = true;
          v.preload = "auto";
          v.playsInline = true;
          v.fetchPriority = "low";
          v.style.display = "none";
          v.addEventListener("canplaythrough", preloadNext, { once: true });
          // fallback in case canplaythrough never fires
          setTimeout(preloadNext, 3000);
          document.head.appendChild(v);
        }
        preloadNext();
      });
    </script>
