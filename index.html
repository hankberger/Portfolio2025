<!DOCTYPE html>
<html lang="en" style="background-color: #0147ff">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Basic SEO -->
    <title>Hank Berger 🐟</title>
    <meta
      name="description"
      content="Portfolio of Hank Berger, a software engineer and creative developer. A scene full of fish swimming around, that react to the user's input."
    />
    <meta name="author" content="Hank Berger" />
    <meta name="robots" content="index, follow" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Standard favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android Chrome -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical (adjust if your main URL is different) -->
    <link rel="canonical" href="https://h4nk.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hank Berger 🐟" />
    <meta
      property="og:description"
      content="Exploring web, mobile, and 3D graphics to craft playful, high-performance experiences."
    />
    <meta property="og:url" content="https://h4nk.com/" />
    <meta property="og:site_name" content="Hank Berger" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hank Berger 🐟" />
    <meta
      name="twitter:description"
      content="Frontend Engineer + Creative Developer."
    />
    <meta name="twitter:image" content="https://h4nk.com/og-image.jpg" />

    <!-- Optional keywords (not super important for Google, but harmless) -->
    <meta
      name="keywords"
      content="Hank Berger, software engineer, creative developer, web developer, mobile developer, 3D graphics, React, TypeScript"
    />

    <!-- Preconnects / Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <script>
      const IS_SAFARI = /^((?!chrome|android).)*safari/i.test(
        navigator.userAgent
      );

      // Pick the correct file (Chrome = webm)
      const sources = ["/first.webm", "/test.webm"];

      sources.forEach((src) => {
        const v = document.createElement("video");
        v.src = src;
        v.muted = true;
        v.preload = "auto";
        v.playsInline = true;
        v.fetchPriority = "high";
        v.style.display = "none";

        // force an early decode warmup
        v.play()
          .then(() => v.pause())
          .catch(() => {});

        document.head.appendChild(v);
      });
    </script>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hank Berger",
        "url": "https://h4nk.com/",
        "jobTitle": "Software Engineer & Creative Developer",
        "description": "Software engineer and creative developer building joyful web, mobile, and 3D experiences.",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
